<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>{% block title %}{{ assistant_name }}{% endblock %}</title>
<style>
:root {
  --bg: #f2f2f5; --card: #ffffff; --ink: #111114; --muted: #8b8b93; --line: #e7e7ec; --chip: #eeeef2;
  --primary: #1c1c1f; --primary-ink: #ffffff; --good: #1e9e57; --good-soft: #e2f6ea; --bad: #c42b2b; --bad-soft: #fde8e7;
  --warn: #a86400; --warn-soft: #fcf0da;
  --shadow: 0 1px 2px rgba(17,17,20,.04), 0 10px 28px -16px rgba(17,17,20,.18);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --card: #1c1c1e; --ink: #f4f4f6; --muted: #9a9aa2; --line: #2c2c30; --chip: #2a2a2e;
    --primary: #f4f4f6; --primary-ink: #111114; --good: #3ccf7a; --good-soft: #10301d; --bad: #ff8a85; --bad-soft: #3a1616;
    --warn: #f1b45a; --warn-soft: #36270e; --shadow: 0 1px 0 rgba(255,255,255,.03); color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1, h2 { margin: 0; font-weight: 800; letter-spacing: -0.025em; line-height: 1.08; text-wrap: balance; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.45rem; }
h3 { margin: 0; font-size: 1rem; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: .875rem; } .tiny { font-size: .78rem; }
.card { background: var(--card); border-radius: 24px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.eyebrow { font-size: .8rem; color: var(--muted); font-weight: 500; }
.logo { width: 56px; height: 56px; border-radius: 16px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; flex: none; overflow: hidden; }
.logo img { width: 44px; height: 44px; object-fit: contain; }
.logo.mono { background: var(--primary); color: var(--primary-ink); font-weight: 800; border: 0; }
.status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 11px; font-size: .8rem; font-weight: 600; background: var(--good-soft); color: var(--good); align-self: flex-start; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; border: 0; border-radius: 999px;
  background: var(--primary); color: var(--primary-ink); font: 650 1rem var(--font); cursor: pointer; padding: 0 22px; text-decoration: none; }
.btn.soft { background: var(--chip); color: var(--ink); }
.btn.sm { width: auto; min-height: 40px; font-size: .9rem; padding: 0 16px; }
.btn:disabled { opacity: .4; }
:focus-visible { outline: 3px solid var(--good); outline-offset: 2px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; counter-increment: s; align-items: start; font-size: .95rem; }
.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 10px; background: var(--chip); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.steps li > div { min-width: 0; padding-top: 4px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
textarea { width: 100%; min-height: 96px; border: 0; border-radius: 14px; padding: 12px 14px; background: var(--chip); color: var(--ink); font: .82rem var(--mono); resize: vertical; }
.msg { border-radius: 16px; padding: 12px 14px; font-size: .9rem; }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
details summary { cursor: pointer; font-weight: 650; font-size: .92rem; }
details[open] summary { margin-bottom: 10px; }
.summary { white-space: pre-line; font-size: .95rem; background: var(--chip); border-radius: 18px; padding: 12px 14px; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
